<script>
const POINTS        = [25,18,15,12,10,8,6,4,2,1];
const SPRINT_POINTS = [8,7,6,5,4,3,2,1];   // wie in der echten F1
const D = Object.fromEntries(DRIVERS.map(d => [d.id, d]));
const $ = s => document.querySelector(s);

/* Zielreihenfolge in Platz und Punkte übersetzen. Ausfälle werden
   übersprungen und bekommen keine Platzziffer. */
function classify(results, table){
  const out = {};
  let pos = 0;
  results.forEach(r => {
    if (r.dnf) return;
    pos++;
    out[r.driver] = { pos, points: table[pos - 1] ?? 0 };
  });
  return out;
}

function racePoints(race){
  const out = classify(race.results, POINTS);
  const fl = race.fastestLap && out[race.fastestLap];
  if (fl){
    out[race.fastestLap].fl = true;
    if (FASTEST_LAP_POINT && out[race.fastestLap].pos <= 10) out[race.fastestLap].points += 1;
  }
  return out;
}

/* Sprint ist optional — ohne sprint-Block gibt es hier schlicht nichts. */
function sprintPoints(race){
  return race.sprint ? classify(race.sprint.results, SPRINT_POINTS) : null;
}

const PTS_BY_RACE = RACES.map(racePoints);
const SPR_BY_RACE = RACES.map(sprintPoints);

/* Gesamtwertung */
function standings(){
  const t = DRIVERS.map(d => ({ ...d, points:0, wins:0, podiums:0, fls:0, best:99 }));
  const by = Object.fromEntries(t.map(x => [x.id, x]));
  RACES.forEach((race, i) => {
    Object.entries(PTS_BY_RACE[i]).forEach(([id, r]) => {
      const e = by[id]; if (!e) return;
      e.points += r.points;
      if (r.pos === 1) e.wins++;
      if (r.pos <= 3) e.podiums++;
      if (r.fl) e.fls++;
      e.best = Math.min(e.best, r.pos);
    });
    /* Sprintpunkte zählen für die Meisterschaft, aber ein Sprintsieg ist
       kein Rennsieg — Siege und Podien bleiben dem Hauptrennen vorbehalten. */
    const s = SPR_BY_RACE[i];
    if (s) Object.entries(s).forEach(([id, r]) => {
      const e = by[id]; if (e) e.points += r.points;
    });
  });
  return t.sort((a,b) => b.points - a.points || b.wins - a.wins || a.best - b.best);
}

/* Navigation oben */
function renderNav(){
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                            .replace(/</g,"&lt;").replace(/>/g,"&gt;");
  $("#topnav").innerHTML = LINKS.map(l => {
    const extern = /^https?:/i.test(l.url);
    return `<a href="${esc(l.url)}"`
         + (extern ? ' target="_blank" rel="noopener noreferrer"' : "")
         + (l.note ? ` title="${esc(l.note)}"` : "")
         + `>${esc(l.label)}`
         + (extern ? '<span class="ext" aria-hidden="true">↗</span>' : "")
         + `</a>`;
  }).join("");
}

/* Konstrukteurswertung. Das Team kommt pro Ergebniszeile aus team, sonst aus
   dem aktuellen Team des Fahrers — so landen Punkte bei dem Rennstall, für
   den sie tatsächlich gefahren wurden. Sprintpunkte zählen mit. */
function constructors(){
  const t = {};
  const buche = (team, id, punkte) => {
    if (!team) return;
    (t[team] ||= { team, points: 0, fahrer: new Set() });
    t[team].points += punkte;
    t[team].fahrer.add(id);
  };
  RACES.forEach((race, i) => {
    const sessions = [[race.results, PTS_BY_RACE[i]]];
    if (race.sprint) sessions.push([race.sprint.results, SPR_BY_RACE[i]]);
    sessions.forEach(([results, pts]) => {
      results.forEach(r => {
        const e = pts[r.driver];
        buche(r.team || D[r.driver]?.team, r.driver, e ? e.points : 0);
      });
    });
  });
  return Object.values(t).sort((a, b) => b.points - a.points || a.team.localeCompare(b.team));
}

function renderConstructors(){
  const c = constructors();
  const lead = c[0]?.points ?? 0;
  $("#teams").innerHTML = c.map((x, i) => {
    const tags = [...x.fahrer]
      .map(id => D[id])
      .filter(Boolean)
      .sort((a, b) => a.tag.localeCompare(b.tag))
      .map(d => d.human ? `<span class="mine">${d.tag}</span>` : d.tag)
      .join(" · ");
    return `
    <div class="row ${i===0?"p1":""}">
      <div class="pos">${i+1}</div>
      <div class="spine" style="background:${TEAM_COLORS[x.team] || "#555"}"></div>
      <div class="who">
        <div class="nm">${x.team}</div>
        <div class="tm">${tags}</div>
      </div>
      <div class="gap">${i===0 ? x.fahrer.size + " Fahrer" : "−" + (lead - x.points)}</div>
      <div class="pts">${x.points}<small>PKT</small></div>
    </div>`;
  }).join("");
}

/* Kopfzahlen */
function renderHead(){
  const s = standings();
  $("#title").innerHTML = LEAGUE_NAME + '<span class="season">' + SEASON + '</span>';
  document.title = "F1 26 MRL — " + LEAGUE_NAME;
  $("#m-rounds").textContent = RACES.length;
  $("#m-leader").textContent = s[0]?.name ?? "–";
  $("#m-drivers").textContent = DRIVERS.length;
  $("#m-next").textContent = "Runde " + (RACES.length + 1);
  $("#flnote").textContent = FASTEST_LAP_POINT ? ", +1 für die schnellste Runde" : "";
}

/* Fahrerwertung als Timing Tower */
function renderTower(){
  const s = standings();
  const lead = s[0]?.points ?? 0;
  $("#tower").innerHTML = s.map((d,i) => `
    <div class="row ${i===0?"p1":""} ${d.human?"human":""}">
      <div class="pos">${i+1}</div>
      <div class="spine" style="background:${d.color}"></div>
      <div class="who">
        <div class="nm">${d.name}</div>
        <div class="tm">${d.team}${d.tag ? ' <span class="tag">' + d.tag + "</span>" : ""}</div>
      </div>
      <div class="gap">${i===0
        ? `${d.wins} ${d.wins===1?"Sieg":"Siege"} · ${d.podiums} ${d.podiums===1?"Podium":"Podien"}`
        : "−" + (lead - d.points)}</div>
      <div class="pts">${d.points}<small>PKT</small></div>
    </div>`).join("");
}

/* Saison-Matrix */
function renderMatrix(){
  const s = standings();
  const head = RACES.map(r =>
    `<th title="${r.circuit}${r.sprint ? " · mit Sprint" : ""}">`
    + `<span class="rnd">R${r.round}${r.sprint ? " · S" : ""}</span>${r.gp}</th>`).join("");
  const body = s.map(d => {
    const cells = RACES.map((r,i) => {
      const e = PTS_BY_RACE[i][d.id];
      if (!e){
        const dnf = r.results.find(x => x.driver === d.id && x.dnf);
        return `<td class="cell out">${dnf ? "DNF" : "–"}</td>`;
      }
      const cls = e.pos<=3 ? "p"+e.pos : (e.points>0 ? "pts-in" : "");
      return `<td class="cell ${cls}">${e.pos}</td>`;
    }).join("");
    return `<tr>
      <th class="${d.human?"human":""}" style="border-left-color:${d.color}">${d.name}</th>
      ${cells}<td class="total">${d.points}</td></tr>`;
  }).join("");
  $("#matrix").innerHTML =
    `<thead><tr><th style="text-align:left;padding-left:14px">Fahrer</th>${head}<th>PKT</th></tr></thead>
     <tbody>${body}</tbody>`;
}

/* Eine Ergebnisliste als Timing Tower — für Rennen und Sprint gleichermaßen */
function towerRows(results, pts, flDriver){
  return results.map((res, i) => {
    const d = D[res.driver] || { name: res.driver, team: "?", color: "#555" };
    const e = pts[res.driver];
    const isFl = flDriver === res.driver;
    return `<div class="row ${res.dnf ? "dnf" : ""} ${i===0 && !res.dnf ? "p1" : ""} ${d.human ? "human" : ""}">
      <div class="pos">${res.dnf ? "–" : e.pos}</div>
      <div class="spine" style="background:${d.color}"></div>
      <div class="who">
        <div class="nm">${d.name}${isFl ? ' <span class="fl">FL</span>' : ""}</div>
        <div class="tm">${d.team}${d.tag ? ' <span class="tag">' + d.tag + "</span>" : ""}</div>
      </div>
      <div class="gap">${res.dnf ? (res.gap || "DNF") : (res.gap || "")}</div>
      <div class="pts">${res.dnf ? 0 : e.points}<small>PKT</small></div>
    </div>`;
  }).join("");
}

/* Einzelrennen */
function renderRace(idx){
  const r = RACES[idx];
  const pts = PTS_BY_RACE[idx];
  document.querySelectorAll(".chip").forEach((c,i) =>
    c.setAttribute("aria-selected", String(i === idx)));

  const rows = towerRows(r.results, pts, r.fastestLap);

  const date = new Date(r.date + "T12:00:00")
    .toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" });

  const pens = (r.penalties || []).map(p => {
    const d = D[p.driver] || { name: p.driver };
    return `<tr>
      <td class="pt">${p.t}</td>
      <td class="pl">R${p.lap}</td>
      <td class="pd ${d.human ? "human" : ""}">${d.name}</td>
      <td class="pw">${p.what}${p.note ? ' <span class="pnote">' + p.note + "</span>" : ""}</td>
      <td class="pp ${/DNF/.test(p.pen) ? "out" : ""}">${p.pen}${p.steward ? ' <span class="pliga">Liga</span>' : ""}</td>
    </tr>`;
  }).join("");

  const spr = SPR_BY_RACE[idx];
  const sprintBlock = spr ? `
    <h3 class="pentitle">Sprint${r.sprint.laps ? " · " + r.sprint.laps + " Runden" : ""}${r.sprint.note ? " · " + r.sprint.note : ""}</h3>
    <div class="tower">${towerRows(r.sprint.results, spr, r.sprint.fastestLap)}</div>` : "";

  $("#race").innerHTML = `
    <div class="racehead">
      <h3>${r.gp}</h3>
      <span>${r.circuit} · ${r.laps} Runden · ${date}${spr ? " · Sprintwochenende" : ""}${r.note ? ' · <span class="korr">' + r.note + "</span>" : ""}</span>
    </div>
    <div class="tower">${rows}</div>
    ${sprintBlock}
    ${pens ? `<h3 class="pentitle">Strafen &amp; Vorfälle</h3>
      <div class="scroller"><table class="pens">
        <thead><tr><th>Zeit</th><th>Runde</th><th>Fahrer</th><th>Vorfall</th><th>Strafe</th></tr></thead>
        <tbody>${pens}</tbody>
      </table></div>` : ""}`;
}

function renderRounds(){
  $("#rounds").innerHTML = RACES.map((r,i) =>
    `<button class="chip" role="tab" aria-selected="false">R${r.round} ${r.gp}</button>`).join("");
  document.querySelectorAll(".chip").forEach((c,i) =>
    c.addEventListener("click", () => renderRace(i)));
}

renderNav();
renderHead();
renderTower();
renderConstructors();
renderMatrix();
renderRounds();
renderRace(RACES.length - 1);
</script>
</body>
</html>
